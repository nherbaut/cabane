<svg xmlns="http://www.w3.org/2000/svg" width="1400px" height="1040px" viewBox="0 0 1400 1040"><rect x="0" y="0" width="1400" height="1040" fill="#fffefd" /><text x="40" y="55" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#20334b">Cellier + cabane — vue d’ensemble du projet</text><text x="40" y="92" font-family="DejaVu Sans" font-size="18" fill="#3a896f">Mur nord commun • passage T1–T2 retenu • accès triangulaire existant vers la pièce de vie</text><text x="40" y="125" font-family="DejaVu Sans" font-size="16" fill="#83939d">Cabane : 190 + 70 = 260 cm de long, sur 90 cm de large.</text><rect x="415.0" y="232.0" width="225.0" height="650.0" fill="#edf2eb" stroke="none" /><rect x="415.0" y="707.0" width="225.0" height="175.0" fill="#f6ead8" stroke="none" /><line x1="415.0" y1="232.0" x2="415.0" y2="882.0" stroke="#3a896f" stroke-width="3" /><line x1="415.0" y1="882.0" x2="640.0" y2="882.0" stroke="#3a896f" stroke-width="3" /><line x1="640.0" y1="232.0" x2="640.0" y2="707.0" stroke="#20334b" stroke-width="3" /><line x1="640.0" y1="707.0" x2="640.0" y2="882.0" stroke="#3a896f" stroke-width="2" stroke-dasharray="7 6" /><line x1="415.0" y1="707.0" x2="640.0" y2="707.0" stroke="#cda464" stroke-width="1" stroke-dasharray="7 6" /><rect x="640.0" y="232.0" width="287.5" height="450.0" fill="#f8f8f5" stroke="none" /><rect x="640.0" y="232.0" width="200.0" height="250.0" fill="#e9edef" stroke="none" /><rect x="865.0" y="232.0" width="62.5" height="450.0" fill="#d6e0e8" opacity="0.65" /><rect x="640.0" y="482.0" width="62.5" height="200.0" fill="#ead7aa" stroke="#937741" stroke-width="2" /><rect x="852.5" y="232.0" width="75.0" height="225.0" fill="#bcdac6" stroke="#3a896f" stroke-width="2" /><rect x="877.5" y="557.0" width="50.0" height="125.0" fill="#e9a4a4" stroke="#a24747" stroke-width="2" /><rect x="640.0" y="232.0" width="287.5" height="450.0" fill="none" stroke="#20334b" stroke-width="4" /><line x1="415.0" y1="232.0" x2="927.5" y2="232.0" stroke="#20334b" stroke-width="4" /><text x="470" y="164" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#20334b">MUR NORD COMMUN</text><text x="440" y="445" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#3a896f">CABANE</text><text x="440" y="475" font-family="DejaVu Sans" font-size="17" fill="#3a896f">Sous l’escalier</text><text x="440" y="510" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#3a896f">260 × 90 cm</text><text x="720.0" y="632.0" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#20334b">CELLIER</text><text x="655.0" y="574.5" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#20334b">A</text><text x="860.0" y="352.0" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#20334b">B</text><text x="880.0" y="627.0" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#20334b">MTA</text><text x="670.0" y="444.5" font-family="DejaVu Sans" font-size="14" fill="#83939d">Escalier au-dessus</text><text x="640" y="305.5" font-family="DejaVu Sans" font-size="38" text-anchor="middle" fill="#3a896f" font-weight="bold">↔</text><text x="430" y="318.5" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#3a896f">Passage T1–T2</text><text x="430" y="343.5" font-family="DejaVu Sans" font-size="15" fill="#3a896f">45 cm libres</text><text x="430" y="259.0" font-family="DejaVu Sans" font-size="14" fill="#3a896f">T1 contre le mur nord</text><circle cx="640" cy="357.0" r="5" fill="#3a896f" /><line x1="640" y1="357.0" x2="670.0" y2="357.0" stroke="#3a896f" stroke-width="2" /><text x="675.0" y="351.0" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#3a896f">T2 · milieu à y = 130 cm</text><text x="675.0" y="372.0" font-family="DejaVu Sans" font-size="12" fill="#3a896f">50 cm du mur nord commun</text><text x="640" y="805.5" font-family="DejaVu Sans" font-size="38" text-anchor="middle" fill="#3a896f" font-weight="bold">↔</text><text x="435" y="788.5" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#986627">Zone basse</text><text x="435" y="814.5" font-family="DejaVu Sans" font-size="14" fill="#986627">sous l’escalier</text><text x="690" y="788.5" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#20334b">PIÈCE DE VIE</text><text x="690" y="820.5" font-family="DejaVu Sans" font-size="15" fill="#3a896f">Accès triangulaire existant</text><text x="690" y="845.5" font-family="DejaVu Sans" font-size="13" fill="#3a896f">70 cm le long du prolongement de la cloison</text><line x1="355" y1="232.0" x2="355" y2="882.0" stroke="#3a896f" stroke-width="2" /><line x1="349" y1="232.0" x2="361" y2="232.0" stroke="#3a896f" stroke-width="2" /><line x1="349" y1="882.0" x2="361" y2="882.0" stroke="#3a896f" stroke-width="2" /><text x="340" y="557.0" font-family="DejaVu Sans" font-size="16" text-anchor="middle" fill="#3a896f" transform="rotate(-90 340 557.0)">260 cm au total</text><line x1="395" y1="232.0" x2="395" y2="707.0" stroke="#3a896f" stroke-width="2" /><line x1="389" y1="232.0" x2="401" y2="232.0" stroke="#3a896f" stroke-width="2" /><line x1="389" y1="707.0" x2="401" y2="707.0" stroke="#3a896f" stroke-width="2" /><text x="380" y="469.5" font-family="DejaVu Sans" font-size="16" text-anchor="middle" fill="#3a896f" transform="rotate(-90 380 469.5)">190 cm</text><line x1="395" y1="707.0" x2="395" y2="882.0" stroke="#3a896f" stroke-width="2" /><line x1="389" y1="707.0" x2="401" y2="707.0" stroke="#3a896f" stroke-width="2" /><line x1="389" y1="882.0" x2="401" y2="882.0" stroke="#3a896f" stroke-width="2" /><text x="380" y="794.5" font-family="DejaVu Sans" font-size="16" text-anchor="middle" fill="#3a896f" transform="rotate(-90 380 794.5)">70 cm</text><line x1="960" y1="232.0" x2="960" y2="682.0" stroke="#20334b" stroke-width="2" /><line x1="954" y1="232.0" x2="966" y2="232.0" stroke="#20334b" stroke-width="2" /><line x1="954" y1="682.0" x2="966" y2="682.0" stroke="#20334b" stroke-width="2" /><text x="945" y="457.0" font-family="DejaVu Sans" font-size="16" text-anchor="middle" fill="#20334b" transform="rotate(-90 945 457.0)">180 cm</text><line x1="415.0" y1="205" x2="640.0" y2="205" stroke="#3a896f" stroke-width="2" /><line x1="415.0" y1="198" x2="415.0" y2="212" stroke="#3a896f" stroke-width="2" /><line x1="640.0" y1="198" x2="640.0" y2="212" stroke="#3a896f" stroke-width="2" /><text x="527.5" y="194" font-family="DejaVu Sans" font-size="16" text-anchor="middle" font-weight="bold" fill="#3a896f">90 cm</text><line x1="640.0" y1="205" x2="927.5" y2="205" stroke="#20334b" stroke-width="2" /><line x1="640.0" y1="198" x2="640.0" y2="212" stroke="#20334b" stroke-width="2" /><line x1="927.5" y1="198" x2="927.5" y2="212" stroke="#20334b" stroke-width="2" /><text x="783.75" y="194" font-family="DejaVu Sans" font-size="16" text-anchor="middle" font-weight="bold" fill="#20334b">115 cm</text><text x="640.0" y="704.0" font-family="DejaVu Sans" font-size="13" fill="#20334b">(0,0) · origine du cellier</text><text x="690" y="720" font-family="DejaVu Sans" font-size="14" fill="#3a896f">Porte sud du cellier à supprimer</text><text x="1085" y="235" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#20334b">Cotes de l’accès T1–T2</text><text x="1085" y="275" font-family="DejaVu Sans" font-size="14" fill="#20334b">T1–T2 : 45 cm libres</text><text x="1085" y="309" font-family="DejaVu Sans" font-size="14" fill="#20334b">T1 : sommet à 169,5 cm</text><text x="1085" y="343" font-family="DejaVu Sans" font-size="14" fill="#20334b">Pièce de l’escalier : 174 cm</text><text x="1085" y="377" font-family="DejaVu Sans" font-size="14" fill="#20334b">Marche au-dessus T2 : 187 cm</text><text x="1085" y="411" font-family="DejaVu Sans" font-size="14" fill="#20334b">T2–T3 : 37,5 cm, sans passage</text><text x="1085" y="468" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#a65d2e">Objectif fini : 168 cm</text><text x="1085" y="496" font-family="DejaVu Sans" font-size="14" fill="#20334b">6 cm pour l’habillage,</text><text x="1085" y="520" font-family="DejaVu Sans" font-size="14" fill="#20334b">la traverse et les équerres.</text><text x="1085" y="548" font-family="DejaVu Sans" font-size="14" fill="#a65d2e">Faisabilité à vérifier côté T1.</text><text x="1085" y="600" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#a24747">Pièce de l’escalier intacte.</text><text x="1085" y="687" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#20334b">Accès existant · vue de côté</text><path d="M1085 825 H1260.0 V725 Z" fill="#f6ead8" stroke="#3a896f" stroke-width="2" /><text x="1172.5" y="850" font-family="DejaVu Sans" font-size="13" text-anchor="middle" fill="#3a896f">Base horizontale : 70 cm</text><text x="1085" y="878" font-family="DejaVu Sans" font-size="12" fill="#83939d">Hauteur non relevée ; pente illustrative.</text><text x="280" y="930" font-family="DejaVu Sans" font-size="15" fill="#83939d">Flèche haute : passage à créer T1–T2. Flèche basse : accès existant vers la pièce de vie.</text><text x="280" y="960" font-family="DejaVu Sans" font-size="14" fill="#83939d">Repère : x vers l’est, y vers le nord, z vers le haut ; cotes en cm.</text><text x="280" y="990" font-family="DejaVu Sans" font-size="14" fill="#83939d">Source : donnees/geometrie.json • cabane 190 + 70 = 260 cm ; épaisseur de cloison non représentée.</text></svg>