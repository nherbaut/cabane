<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img"><title>Gabarit A4 1:1 : essai compact pour 168 cm finis, résistance non validée</title><rect x="0" y="0" width="210" height="297" fill="white" /><text x="12" y="15" font-family="DejaVu Sans" font-size="5" font-weight="bold" fill="#20334b">Essai compact — objectif 168 cm finis</text><text x="12" y="24" font-family="DejaVu Sans" font-size="3.4" fill="#20334b">Gabarit A4 à taille réelle · contrôle de place uniquement</text><text x="12" y="34" font-family="DejaVu Sans" font-size="3.3" fill="#20334b">Panneau 12 mm + traverse 20 mm + équerre de 20 mm = 52 mm.</text><text x="12" y="41" font-family="DejaVu Sans" font-size="3.3" fill="#20334b">Marge nominale : 8 mm sous la pièce de l’escalier à 174 cm.</text><text x="12" y="48" font-family="DejaVu Sans" font-size="3.3" fill="#a24747">Bois des montants, perçages et vis : à vérifier sur place.</text><rect x="48" y="84" width="22" height="96" fill="#e5bc7b" /><line x1="48" y1="84" x2="48" y2="180" stroke="#98713f" stroke-width="0.5" /><line x1="70" y1="84" x2="70" y2="180" stroke="#98713f" stroke-width="0.5" /><line x1="48" y1="84" x2="70" y2="84" stroke="#98713f" stroke-width="0.5" stroke-dasharray="2 2" /><rect x="70" y="108.00000000000011" width="40" height="20" fill="#e5bc7b" stroke="#98713f" stroke-width="0.5" /><rect x="70" y="128.0000000000001" width="40" height="12.0" fill="#a9d2ae" stroke="#3a896f" stroke-width="0.5" /><path d="M70 88.00000000000011 H72 V106.00000000000011 H90 V108.00000000000011 H70 Z" fill="#d6834b" /><rect x="44" y="125.0" width="3" height="55.0" fill="#617986" /><line x1="30" y1="80" x2="112" y2="80" stroke="#a24747" stroke-width="0.8" /><line x1="24" y1="80" x2="24" y2="88.00000000000011" stroke="#3a896f" stroke-width="0.5" /><line x1="22" y1="80" x2="26" y2="80" stroke="#3a896f" stroke-width="0.5" /><line x1="22" y1="88.00000000000011" x2="26" y2="88.00000000000011" stroke="#3a896f" stroke-width="0.5" /><text x="13" y="85" font-family="DejaVu Sans" font-size="2.9" fill="#3a896f">8 mm</text><line x1="111" y1="80" x2="119" y2="80" stroke="#a24747" stroke-width="0.4" /><text x="122" y="80" font-family="DejaVu Sans" font-size="3.1" fill="#a24747">174 cm · pièce de l’escalier</text><line x1="111" y1="88.00000000000011" x2="119" y2="88.00000000000011" stroke="#a65d2e" stroke-width="0.4" /><text x="122" y="90.00000000000011" font-family="DejaVu Sans" font-size="3.1" fill="#a65d2e">173,2 cm · haut de l’équerre</text><line x1="111" y1="108.00000000000011" x2="119" y2="108.00000000000011" stroke="#20334b" stroke-width="0.4" /><text x="122" y="110.00000000000011" font-family="DejaVu Sans" font-size="3.1" fill="#20334b">171,2 cm · dessus traverse</text><line x1="111" y1="128.0000000000001" x2="119" y2="128.0000000000001" stroke="#20334b" stroke-width="0.4" /><text x="122" y="130.0000000000001" font-family="DejaVu Sans" font-size="3.1" fill="#20334b">169,2 cm · dessous traverse</text><line x1="111" y1="140" x2="119" y2="140" stroke="#3a896f" stroke-width="0.4" /><text x="122" y="144" font-family="DejaVu Sans" font-size="3.1" fill="#3a896f">168 cm · hauteur finie cible</text><line x1="35" y1="125.0" x2="48" y2="125.0" stroke="#617986" stroke-width="0.4" /><text x="5" y="123.0" font-family="DejaVu Sans" font-size="3" fill="#617986">T1 : 169,5 cm</text><text x="61" y="174" font-family="DejaVu Sans" font-size="3" transform="rotate(-90 61 174)" fill="#20334b">Support bois à vérifier</text><text x="122" y="158" font-family="DejaVu Sans" font-size="3.2" font-weight="bold" fill="#20334b">Traverse : 20 × 40 mm</text><text x="122" y="165" font-family="DejaVu Sans" font-size="3" fill="#20334b">20 mm verticalement,</text><text x="122" y="171" font-family="DejaVu Sans" font-size="3" fill="#20334b">40 mm en profondeur.</text><text x="122" y="178" font-family="DejaVu Sans" font-size="3" fill="#20334b">Longueur à relever.</text><text x="12" y="194" font-family="DejaVu Sans" font-size="4" font-weight="bold" fill="#20334b">Essai à blanc avant achat définitif et découpe</text><text x="12" y="204" font-family="DejaVu Sans" font-size="3.2" fill="#20334b">1. Vérifier l’entrée et le maintien du bois dans T1 et T2.</text><text x="12" y="212" font-family="DejaVu Sans" font-size="3.2" fill="#20334b">2. Présenter l’équerre, les vis envisagées et le tournevis.</text><text x="12" y="220" font-family="DejaVu Sans" font-size="3.2" fill="#20334b">3. Vérifier la prise des vis dans les 20 mm de traverse</text><text x="12" y="227" font-family="DejaVu Sans" font-size="3.2" fill="#20334b">   et dans le bois prolongé au-dessus du métal de T1.</text><text x="12" y="235" font-family="DejaVu Sans" font-size="3.2" fill="#20334b">4. Vérifier la tenue du plâtre conservé et de la cloison.</text><line x1="20" y1="253" x2="70" y2="253" stroke="#20334b" stroke-width="0.5" /><line x1="20" y1="250" x2="20" y2="256" stroke="#20334b" stroke-width="0.5" /><line x1="70" y1="250" x2="70" y2="256" stroke="#20334b" stroke-width="0.5" /><text x="20" y="263" font-family="DejaVu Sans" font-size="3.1" fill="#20334b">Contrôle d’impression : cette barre doit mesurer 50 mm.</text><text x="12" y="275" font-family="DejaVu Sans" font-size="3.3" font-weight="bold" fill="#20334b">Imprimer à 100 % / taille réelle, sans adapter à la page.</text><text x="12" y="283" font-family="DejaVu Sans" font-size="3.2" fill="#a24747">Géométrie proposée ; capacité de la liaison non validée.</text><text x="12" y="291" font-family="DejaVu Sans" font-size="2.8" fill="#20334b">Référence d’essai : Hettich 9240442, 16 × 20 × 20 × 2 mm. Vis non fournies.</text></svg>