="#777" stroke-width="0.6" /><text x="700" y="588" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#20334b">Escalier en partie haute</text><text x="700" y="611" font-family="DejaVu Sans" font-size="13" fill="#20334b">x=0..80, y=80..180, modèle z libre 188</text><text x="670" y="687" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#20334b">Passage vers cabane</text><text x="670" y="710" font-family="DejaVu Sans" font-size="13" fill="#20334b">T1–T2 : 45 cm libres.</text><text x="670" y="730" font-family="DejaVu Sans" font-size="13" fill="#20334b">T2–T3 : 37.5 cm libres.</text><text x="670" y="755" font-size="13" font-family="DejaVu Sans" fill="#a24747">Faces exactes non placées dans le repère.</text><text x="670" y="780" font-size="13" font-family="DejaVu Sans" fill="#a24747">La ligne orange (80 cm) est une ANCIENNE</text><text x="670" y="802" font-size="13" font-family="DejaVu Sans" fill="#a24747">hypothèse : ce N’EST PAS le trou à découper.</text><line x1="40" y1="897" x2="1060" y2="897" stroke="#c6cdd1" /><text x="45" y="924" font-size="14" font-family="DejaVu Sans" fill="#20334b">Référence : géométrie.json • les largeurs de baie sont cotées, leurs faces restent à localiser</text></svg>