0" /><text fill="#20334b" font-family="DejaVu Sans" font-size="18" text-anchor="middle" transform="rotate(-90 187.3,556.0)" x="187.3" y="556.0">180 cm</text><text fill="#206d9a" font-family="DejaVu Sans" font-size="13" x="370.20000000000005" y="813.9">x vers est →</text><text fill="#206d9a" font-family="DejaVu Sans" font-size="13" x="100.5" y="203.19999999999993">↑ y vers nord</text><text fill="#20334b" font-family="DejaVu Sans" font-size="15" x="243.1" y="773.6">(0,0)</text><text fill="#20334b" font-family="DejaVu Sans" font-size="23" font-weight="bold" x="670" y="170">Emprises et limites</text><rect fill="#ead7aa" height="18" stroke="#777" stroke-width="0.6" width="18" x="670" y="196" /><text fill="#20334b" font-family="DejaVu Sans" font-size="16" font-weight="bold" x="700" y="211">A — réserves alimentaires</text><text fill="#20334b" font-family="DejaVu Sans" font-size="13" x="700" y="234">x=0..25, y=0..80, hauteur 240</text><rect fill="#bcdac6" height="18" stroke="#777" stroke-width="0.6" width="18" x="670" y="285" /><text fill="#20334b" font-family="DejaVu Sans" font-size="16" font-weight="bold" x="700" y="300">B — petit matériel</text><text fill="#20334b" font-family="DejaVu Sans" font-size="13" x="700" y="323">x=85..115, y=90..180, hauteur 220</text><rect fill="#e9a4a4" height="18" stroke="#777" stroke-width="0.6" width="18" x="670" y="374" /><text fill="#20334b" font-family="DejaVu Sans" font-size="16" font-weight="bold" x="700" y="389">Module de chauffage urbain</text><text fill="#20334b" font-family="DejaVu Sans" font-size="13" x="700" y="412">x=95..115, y=0..50, hauteur 230</text><text fill="#20334b" font-family="DejaVu Sans" font-size="13" x="700" y="432">Accès à préserver côté ouest</text><rect fill="#d6e0e8" height="18" stroke="#777" stroke-width="0.6" width="18" x="670" y="484" /><text fill="#20334b" font-family="DejaVu Sans" font-size="16" font-weight="bold" x="700" y="499">Poutre est</text><text fill="#20334b" font-family="DejaVu Sans" font-size="13" x="700" y="522">x=90..115, y=0..180, dessous à z=230</text><rect fill="#f0f1f4" height="18" stroke="#777" stroke-width="0.6" width="18" x="670" y="573" /><text fill="#20334b" font-family="DejaVu Sans" font-size="16" font-weight="bold" x="700" y="588">Escalier en partie haute</text><text fill="#20334b" font-family="DejaVu Sans" font-size="13" x="700" y="611">x=0..80, y=80..180, modèle z libre 188</text><text fill="#20334b" font-family="DejaVu Sans" font-size="16" font-weight="bold" x="670" y="687">Nouvelle baie vers cabane</text><text fill="#20334b" font-family="DejaVu Sans" font-size="13" x="670" y="710">Largeur annoncée ≈ 53 cm,</text><text fill="#a24747" font-family="DejaVu Sans" font-size="13" x="670" y="740">y exact non mesuré : travée 1 ou 2.</text><text fill="#a24747" font-family="DejaVu Sans" font-size="13" x="670" y="780">La ligne orange (80 cm) est une ANCIENNE</text><text fill="#a24747" font-family="DejaVu Sans" font-size="13" x="670" y="802">hypothèse : ce N’EST PAS le trou à découper.</text><line stroke="#c6cdd1" x1="40" x2="1060" y1="897" y2="897" /><text fill="#20334b" font-family="DejaVu Sans" font-size="14" x="45" y="924">Référence : cotes déclarées par l’utilisateur • ne pas déduire les dimensions de la baie de ce dessin</text></svg>