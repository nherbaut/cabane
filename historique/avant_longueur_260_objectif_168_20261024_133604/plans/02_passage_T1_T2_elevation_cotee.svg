<svg xmlns="http://www.w3.org/2000/svg" width="1100px" height="1000px" viewBox="0 0 1100 1000"><rect x="0" y="0" width="1100" height="1000" fill="#fffefd" /><text x="40" y="52" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#20334b">Passage T1–T2 — élévation cotée</text><text x="40" y="84" font-family="DejaVu Sans" font-size="17" fill="#206d9a">Vue depuis la cabane  |  cotes en cm  |  choix du passage acté</text><text x="40" y="116" font-family="DejaVu Sans" font-size="15" fill="#83939d">Les traits cotés sont à l’échelle ; aucun niveau de découpe n’est fixé.</text><line x1="210" y1="900" x2="580" y2="900" stroke="#20334b" stroke-width="3" /><line x1="300" y1="222.0" x2="300" y2="900" stroke="#617986" stroke-width="7" /><line x1="480" y1="204" x2="480" y2="900" stroke="#617986" stroke-width="7" /><line x1="260" y1="204" x2="525" y2="204" stroke="#a24747" stroke-width="5" /><line x1="260" y1="200" x2="525" y2="200" stroke="#a24747" stroke-width="1" stroke-dasharray="7 5" /><rect x="304" y="207" width="172" height="692" fill="#e7f1eb" opacity="0.55" /><line x1="300" y1="222.0" x2="300" y2="900" stroke="#617986" stroke-width="7" /><line x1="480" y1="204" x2="480" y2="900" stroke="#617986" stroke-width="7" /><line x1="480" y1="152" x2="480" y2="204" stroke="#617986" stroke-width="5" stroke-dasharray="8 6" /><text x="288" y="285" font-family="DejaVu Sans" font-size="16" text-anchor="end" font-weight="bold" fill="#20334b">T1 · nord</text><text x="494" y="285" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#20334b">T2 · sud</text><text x="600" y="210" font-family="DejaVu Sans" font-size="16" fill="#a24747" font-weight="bold">Pièce liée à l’escalier : sous-face à 174 cm</text><text x="600" y="261.0" font-family="DejaVu Sans" font-size="16" fill="#617986" font-weight="bold">Sommet de T1 : 169.5 cm</text><text x="600" y="290.0" font-family="DejaVu Sans" font-size="15" fill="#83939d">Écart vertical local : 4.5 cm</text><text x="600" y="345" font-family="DejaVu Sans" font-size="16" fill="#20334b">T2 se prolonge sous la marche (pointillé).</text><text x="600" y="375" font-family="DejaVu Sans" font-size="16" fill="#20334b">Sous-face de cette marche : 187 cm.</text><text x="600" y="440" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#20334b">Hauteur de la traverse : à définir.</text><text x="600" y="470" font-family="DejaVu Sans" font-size="15" fill="#20334b">Équerres au-dessus : place à vérifier côté T1.</text><text x="600" y="500" font-family="DejaVu Sans" font-size="15" fill="#a24747">La pièce de l’escalier reste intacte.</text><line x1="300" y1="942" x2="480" y2="942" stroke="#3a896f" stroke-width="2" /><line x1="300" y1="935" x2="300" y2="949" stroke="#3a896f" stroke-width="2" /><line x1="480" y1="935" x2="480" y2="949" stroke="#3a896f" stroke-width="2" /><text x="390.0" y="932" font-family="DejaVu Sans" font-size="16" text-anchor="middle" fill="#3a896f" font-weight="bold">45 cm libres avant habillage</text><line x1="230" y1="204" x2="230" y2="900" stroke="#3a896f" stroke-width="2" /><line x1="223" y1="204" x2="237" y2="204" stroke="#3a896f" stroke-width="2" /><line x1="223" y1="900" x2="237" y2="900" stroke="#3a896f" stroke-width="2" /><text x="214" y="552.0" font-family="DejaVu Sans" font-size="16" text-anchor="middle" fill="#3a896f" transform="rotate(-90 214 552.0)">174 cm · limite haute locale</text><text x="600" y="565" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#20334b">Passage fini : largeur et hauteur à confirmer</text><text x="600" y="595" font-family="DejaVu Sans" font-size="15" fill="#20334b">après choix des bois et de leurs fixations.</text><text x="600" y="665" font-family="DejaVu Sans" font-size="15" fill="#a24747">Aucune coupe ni fixation dans la pièce liée</text><text x="600" y="690" font-family="DejaVu Sans" font-size="15" fill="#a24747">à l’escalier sans vérification de sa fonction.</text><text x="40" y="980" font-family="DejaVu Sans" font-size="14" fill="#83939d">Source : donnees/geometrie.json • relevé coté, non plan de découpe ou de structure</text></svg>