<svg xmlns="http://www.w3.org/2000/svg" width="1400px" height="980px" viewBox="0 0 1400 980"><rect x="0" y="0" width="1400" height="980" fill="#fffefd" /><text x="40" y="55" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#20334b">Cellier + cabane — vue d’ensemble du projet</text><text x="40" y="92" font-family="DejaVu Sans" font-size="19" fill="#3a896f">Mur nord commun confirmé • passage décidé entre T1 et T2</text><text x="40" y="125" font-family="DejaVu Sans" font-size="16" fill="#83939d">Cellier à l’échelle ; emprise de la cabane schématique, non mesurée.</text><rect x="280" y="232.0" width="360" height="378" fill="#edf2eb" stroke="#3a896f" stroke-width="2" stroke-dasharray="9 7" /><rect x="640.0" y="232.0" width="356.5" height="558.0" fill="#f8f8f5" stroke="none" /><rect x="640.0" y="232.0" width="248.0" height="310.0" fill="#e9edef" stroke="none" /><rect x="919.0" y="232.0" width="77.5" height="558.0" fill="#d6e0e8" opacity="0.65" /><rect x="640.0" y="542.0" width="77.5" height="248.0" fill="#ead7aa" stroke="#937741" stroke-width="2" /><rect x="903.5" y="232.0" width="93.0" height="279.0" fill="#bcdac6" stroke="#3a896f" stroke-width="2" /><rect x="934.5" y="635.0" width="62.0" height="155.0" fill="#e9a4a4" stroke="#a24747" stroke-width="2" /><rect x="640.0" y="232.0" width="356.5" height="558.0" fill="none" stroke="#20334b" stroke-width="4" /><line x1="280" y1="232.0" x2="996.5" y2="232.0" stroke="#20334b" stroke-width="4" /><text x="470" y="185" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#20334b">MUR NORD COMMUN</text><text x="330" y="435" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#3a896f">CABANE</text><text x="330" y="465" font-family="DejaVu Sans" font-size="18" fill="#3a896f">Sous l’escalier</text><text x="330" y="495" font-family="DejaVu Sans" font-size="15" fill="#83939d">Emprise schématique</text><text x="330" y="519" font-family="DejaVu Sans" font-size="15" fill="#83939d">Dimensions non relevées</text><text x="760" y="720" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#20334b">CELLIER</text><text x="658.6" y="656.7" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#20334b">A</text><text x="912.8" y="380.8" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#20334b">B</text><text x="937.6" y="721.8" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#20334b">MTA</text><text x="686.5" y="483.09999999999997" font-family="DejaVu Sans" font-size="15" fill="#83939d">Escalier au-dessus</text><text x="640" y="320.5" font-family="DejaVu Sans" font-size="40" text-anchor="middle" fill="#3a896f" font-weight="bold">↔</text><text x="320" y="333.5" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#3a896f">Passage T1–T2</text><text x="320" y="359.5" font-family="DejaVu Sans" font-size="16" fill="#3a896f">45 cm libres avant habillage</text><text x="320" y="262.0" font-family="DejaVu Sans" font-size="15" fill="#3a896f">T1 contre le mur nord</text><circle cx="640" cy="387.0" r="6" fill="#3a896f" /><line x1="640" y1="387.0" x2="677.2" y2="387.0" stroke="#3a896f" stroke-width="2" /><text x="683.4" y="379.0" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#3a896f">T2 · milieu à y = 130 cm</text><text x="683.4" y="402.0" font-family="DejaVu Sans" font-size="13" fill="#3a896f">50 cm du mur nord commun</text><line x1="235" y1="232.0" x2="235" y2="387.0" stroke="#3a896f" stroke-width="2" /><line x1="228" y1="232.0" x2="242" y2="232.0" stroke="#3a896f" stroke-width="2" /><line x1="228" y1="387.0" x2="242" y2="387.0" stroke="#3a896f" stroke-width="2" /><text x="217" y="309.5" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#3a896f" transform="rotate(-90 217 309.5)">50 cm → milieu T2</text><line x1="640.0" y1="205" x2="996.5" y2="205" stroke="#20334b" stroke-width="2" /><line x1="640.0" y1="198" x2="640.0" y2="212" stroke="#20334b" stroke-width="2" /><line x1="996.5" y1="198" x2="996.5" y2="212" stroke="#20334b" stroke-width="2" /><text x="818.25" y="194" font-family="DejaVu Sans" font-size="16" text-anchor="middle" font-weight="bold" fill="#20334b">115 cm</text><line x1="1030" y1="790.0" x2="1030" y2="232.0" stroke="#20334b" stroke-width="2" /><line x1="1023" y1="790.0" x2="1037" y2="790.0" stroke="#20334b" stroke-width="2" /><line x1="1023" y1="232.0" x2="1037" y2="232.0" stroke="#20334b" stroke-width="2" /><text x="1053" y="511.0" font-family="DejaVu Sans" font-size="16" text-anchor="middle" transform="rotate(-90 1053 511.0)" fill="#20334b">180 cm</text><text x="640.0" y="815.0" font-family="DejaVu Sans" font-size="14" fill="#20334b">(0,0) · origine du cellier</text><text x="320" y="660" font-family="DejaVu Sans" font-size="16" fill="#20334b">Accès existant de la cabane</text><text x="320" y="687" font-family="DejaVu Sans" font-size="16" fill="#20334b">depuis la pièce de vie</text><text x="320" y="714" font-family="DejaVu Sans" font-size="13" fill="#83939d">(position non représentée)</text><text x="690" y="847" font-family="DejaVu Sans" font-size="14" fill="#3a896f">Porte sud du cellier supprimée dans le projet</text><text x="1085" y="235" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#20334b">Cotes de l’accès</text><text x="1085" y="275" font-family="DejaVu Sans" font-size="14" fill="#20334b">T1–T2 : 45 cm libres</text><text x="1085" y="309" font-family="DejaVu Sans" font-size="14" fill="#20334b">T1 : sommet à 169,5 cm</text><text x="1085" y="343" font-family="DejaVu Sans" font-size="14" fill="#20334b">Pièce de l’escalier : 174 cm</text><text x="1085" y="377" font-family="DejaVu Sans" font-size="14" fill="#20334b">Marche au-dessus T2 : 187 cm</text><text x="1085" y="411" font-family="DejaVu Sans" font-size="14" fill="#20334b">T2–T3 : 37,5 cm, sans passage</text><text x="1085" y="470" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#20334b">Hauteur finie à définir</text><text x="1085" y="500" font-family="DejaVu Sans" font-size="14" fill="#20334b">Équerres au-dessus :</text><text x="1085" y="524" font-family="DejaVu Sans" font-size="14" fill="#20334b">place à vérifier côté T1.</text><text x="1085" y="585" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#a24747">Pièce liée à l’escalier</text><text x="1085" y="610" font-family="DejaVu Sans" font-size="15" fill="#a24747">conservée intacte.</text><text x="280" y="892" font-family="DejaVu Sans" font-size="15" fill="#83939d">La flèche indique la liaison choisie ; les bords de découpe seront définis avec l’encadrement.</text><text x="280" y="923" font-family="DejaVu Sans" font-size="14" fill="#83939d">Repère commun : x vers l’est, y vers le nord, z vers le haut ; cotes en cm.</text><text x="280" y="952" font-family="DejaVu Sans" font-size="14" fill="#83939d">Source : donnees/geometrie.json • aucune dimension de cabane déduite des photographies.</text></svg>