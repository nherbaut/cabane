name: Publier le site Hugo sur GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  TZ: Europe/Paris

jobs:
  build:
    name: Générer les plans et le site
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Installer le moteur SVG
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends librsvg2-bin

      - name: Installer la version Hugo utilisée localement
        run: make site-hugo-install

      - name: Lire la configuration de GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Construire le site à son adresse publique
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}/
        run: make site-build

      - name: Préparer les fichiers à publier
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    name: Publier sur GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v5
