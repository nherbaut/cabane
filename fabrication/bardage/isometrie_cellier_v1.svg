  <g id="text_9">
   <text style="font: 10px 'DejaVu Sans'; text-anchor: start" x="50.4" y="783.648" transform="rotate(-0 50.4 783.648)">Les baguettes recouvrent leur raccord avec le plâtre, sur les trois côtés du passage.</text>
