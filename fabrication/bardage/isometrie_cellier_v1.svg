  <g id="text_7">
   <text style="font: 12px 'DejaVu Sans'; text-anchor: middle" x="360" y="66.528" transform="rotate(-0 360 66.528)">Mur peint montré partiellement • Panneaux intérieurs • Couvre-joints proposés</text>
  </g>
  <g id="text_8">
   <text style="font: 10px 'DejaVu Sans'; text-anchor: start" x="50.4" y="760.32" transform="rotate(-0 50.4 760.32)">Les retours de 6 cm arrivent au niveau de la surface du plâtre côté cellier.</text>
